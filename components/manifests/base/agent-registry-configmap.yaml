apiVersion: v1
kind: ConfigMap
metadata:
  name: ambient-agent-registry
data:
  agent-registry.json: |
    [
      {
        "id": "claude-agent-sdk",
        "displayName": "Claude Code",
        "description": "Anthropic Claude with full coding capabilities",
        "defaultModel": "claude-sonnet-4-5",
        "models": [
          {"value": "claude-sonnet-4-5", "label": "Claude Sonnet 4.5"},
          {"value": "claude-opus-4-6", "label": "Claude Opus 4.6"},
          {"value": "claude-opus-4-5", "label": "Claude Opus 4.5"},
          {"value": "claude-haiku-4-5", "label": "Claude Haiku 4.5"}
        ],
        "requiredSecrets": ["ANTHROPIC_API_KEY"],
        "internalEnvVars": {
          "RUNNER_TYPE": "claude-agent-sdk",
          "RUNNER_STATE_DIR": ".claude"
        }
      },
      {
        "id": "google-adk",
        "displayName": "Gemini (Google ADK)",
        "description": "Google Gemini via Agent Development Kit",
        "defaultModel": "gemini-2.5-flash",
        "models": [
          {"value": "gemini-2.5-flash", "label": "Gemini 2.5 Flash"},
          {"value": "gemini-2.5-pro", "label": "Gemini 2.5 Pro"},
          {"value": "gemini-2.0-flash", "label": "Gemini 2.0 Flash"}
        ],
        "requiredSecrets": ["GOOGLE_API_KEY"],
        "internalEnvVars": {
          "RUNNER_TYPE": "google-adk",
          "RUNNER_STATE_DIR": ".adk"
        }
      }
    ]
